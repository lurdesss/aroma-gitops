# Valores base de inventario. Cada ambiente sobrescribe solo lo que cambia
# (values-staging.yaml, values-prod.yaml).
nombre: inventario
ambiente: base

imagen:
  repositorio: ghcr.io/lurdesss/pr-cticas-sa-b-202103763/inventario-service
  # Tag de version publicado por el pipeline del tag git v1.0.0 (nunca latest).
  tag: v1.0.0

puerto: 4002
replicas: 2

pdb:
  minDisponibles: 1

recursos:
  requests: { cpu: 50m, memory: 128Mi }
  limits:   { cpu: 300m, memory: 384Mi }

# Variables de entorno adicionales (texto plano, nunca secretos).
entorno:
  NIVEL_LOG: info

baseDeDatos:
  habilitada: true
  # Secret que el operador de Zalando genera para el usuario "aroma"
  # (contrasena aleatoria creada dentro del cluster, nunca en Git).
  secreto: aroma.aroma-pg.credentials.postgresql.acid.zalan.do
  # Service de la instancia primaria (lectura/escritura).
  host: aroma-pg
  nombre: inventario_db
  # Python, FastAPI + GraphQL: SQLAlchemy con psycopg 3
  esquema: postgresql+psycopg
  # Spilo solo acepta conexiones remotas cifradas (hostnossl ... reject).
  # libpq "require" cifra sin validar el certificado autofirmado.
  # Limite reconocido: no hay verificacion de CA.
  parametros: "?sslmode=require"
