# Valores base de pedidos. Cada ambiente sobrescribe solo lo que cambia
# (values-staging.yaml, values-prod.yaml).
nombre: pedidos
ambiente: base

imagen:
  repositorio: ghcr.io/lurdesss/pr-cticas-sa-b-202103763/pedidos-service
  # Tag de version publicado por el pipeline del tag git v1.0.0 (nunca latest).
  tag: v1.0.0

puerto: 4003
replicas: 2

pdb:
  minDisponibles: 1

recursos:
  requests: { cpu: 50m, memory: 96Mi }
  limits:   { cpu: 300m, memory: 256Mi }

# Variables de entorno adicionales (texto plano, nunca secretos).
entorno:
  NIVEL_LOG: info
  # pedidos consulta el precio y la disponibilidad al catalogo.
  CATALOGO_URL: http://catalogo:4001
  # Sin RabbitMQ en P9: al crear un pedido, el servicio intenta publicar el
  # evento, registra el fallo y responde igual (el pedido ya quedo en BD).

baseDeDatos:
  habilitada: true
  # Secret que el operador de Zalando genera para el usuario "aroma"
  # (contrasena aleatoria creada dentro del cluster, nunca en Git).
  secreto: aroma.aroma-pg.credentials.postgresql.acid.zalan.do
  # Service de la instancia primaria (lectura/escritura).
  host: aroma-pg
  nombre: pedidos_db
  # Node.js, REST: driver pg de Node.js
  esquema: postgres
  # Spilo solo acepta conexiones remotas cifradas (hostnossl ... reject).
  # El certificado es autofirmado: "no-verify" cifra sin validar la CA
  # (pg-connection-string). Limite reconocido: no hay verificacion de CA.
  parametros: "?sslmode=no-verify"
