# PostgreSQL de produccion del sistema Aroma (servicio con estado de P9).
#
# - 2 instancias: 1 primaria + 1 replica en streaming. El operador
#   promueve la replica si la primaria se pierde (failover automatico).
# - Anti-afinidad obligatoria por nodo: cada instancia en un worker
#   distinto, para que perder un nodo no se lleve las dos.
# - Un PVC por instancia (aroma-pg-1, aroma-pg-2) en local-path; Velero
#   los respalda a nivel de archivo (Kopia).
# - La credencial del usuario "aroma" es un SealedSecret (credencial.yaml)
#   con contrasena fija: tras reconstruir o restaurar, los servicios y los
#   datos restaurados siguen usando la misma contrasena.
# - El operador crea por si mismo los PodDisruptionBudget de la primaria
#   y de las replicas.
apiVersion: postgresql.cnpg.io/v1
kind: Cluster
metadata:
  name: aroma-pg
  namespace: aroma-prod
spec:
  instances: 2
  # Tag fijo (nunca latest), imagen publica oficial del proyecto.
  imageName: ghcr.io/cloudnative-pg/postgresql:17.5
  primaryUpdateStrategy: unsupervised

  storage:
    storageClass: standard
    size: 1Gi

  affinity:
    enablePodAntiAffinity: true
    podAntiAffinityType: required
    topologyKey: kubernetes.io/hostname

  # Requests/limits explicitos: aroma-prod tiene ResourceQuota y Kyverno
  # exige limites de CPU y memoria.
  resources:
    requests: { cpu: 100m, memory: 256Mi }
    limits:   { cpu: 500m, memory: 512Mi }

  bootstrap:
    initdb:
      # Base por defecto (catalogo) y dueno de las demas.
      database: catalogo_db
      owner: aroma
      secret:
        name: aroma-pg-app
      # Una base por microservicio, igual que en P5. Solo se ejecuta al
      # crear el cluster por primera vez (datos vacios).
      postInitSQL:
        - CREATE DATABASE inventario_db OWNER aroma
        - CREATE DATABASE pedidos_db OWNER aroma
        - CREATE DATABASE resenas_db OWNER aroma
