# PodDisruptionBudget de PostgreSQL: de las 2 instancias, al menos 1 debe
# seguir en ejecucion. Un "kubectl drain" puede desalojar una instancia
# (si era la primaria, Patroni promueve a la otra) pero nunca las dos.
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: aroma-pg
  namespace: aroma-prod
spec:
  minAvailable: 1
  selector:
    matchLabels:
      application: spilo
      cluster-name: aroma-pg
