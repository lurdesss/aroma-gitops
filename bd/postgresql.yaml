# PostgreSQL de produccion del sistema Aroma (servicio con estado de P9).
#
# El operador de Zalando crea a partir de este recurso:
# - StatefulSet "aroma-pg" con 2 replicas (primaria + replica en
#   streaming). Patroni promueve la replica si la primaria se pierde.
# - Un PVC por instancia en la StorageClass "aroma-local" (Terraform,
#   P9/terraform/almacenamiento.tf): pgdata-aroma-pg-0 y pgdata-aroma-pg-1.
#   Velero los respalda a nivel de archivo (Kopia). No se usa "standard":
#   crea PV hostPath, que Velero omite sin error (backup "Completed" sin
#   los datos; detectado en el Bloque 8a).
# - Services: aroma-pg (siempre la primaria, lectura/escritura) y
#   aroma-pg-repl (replicas, solo lectura).
# - El Secret aroma.aroma-pg.credentials.postgresql.acid.zalan.do con el
#   usuario "aroma" y una contrasena aleatoria generada dentro del cluster
#   (nunca pasa por Git).
#
# El nombre debe empezar con el teamId ("aroma-"): regla del operador.
apiVersion: acid.zalan.do/v1
kind: postgresql
metadata:
  name: aroma-pg
  namespace: aroma-prod
spec:
  teamId: aroma
  numberOfInstances: 2
  postgresql:
    version: "17"
  volume:
    size: 1Gi
    storageClass: aroma-local
  # Requests/limits explicitos: aroma-prod tiene ResourceQuota y Kyverno
  # exige limites de CPU y memoria.
  resources:
    requests: { cpu: 100m, memory: 256Mi }
    limits:   { cpu: 500m, memory: 512Mi }
  # Hooks de Velero en los pods de PostgreSQL. Velero copia los archivos del
  # volumen en caliente (Kopia) y esa copia puede no ser consistente si hay
  # escrituras durante el respaldo. Antes de copiar, cada instancia escribe
  # un volcado logico consistente (pg_dumpall) DENTRO del mismo volumen y
  # fuerza un CHECKPOINT. Si los archivos restaurados no arrancan, el
  # volcado permite recuperar el contenido. Si el hook falla, el respaldo
  # queda PartiallyFailed (no se oculta el error).
  podAnnotations:
    pre.hook.backup.velero.io/container: postgres
    pre.hook.backup.velero.io/command: '["/bin/bash", "-c", "mkdir -p /home/postgres/pgdata/respaldo-logico && pg_dumpall -U postgres -f /home/postgres/pgdata/respaldo-logico/dumpall.sql && psql -U postgres -c CHECKPOINT"]'
    pre.hook.backup.velero.io/on-error: Fail
    pre.hook.backup.velero.io/timeout: 120s
  users:
    aroma:
      - createdb
  # Una base por microservicio, igual que en P5; todas del usuario aroma.
  databases:
    catalogo_db: aroma
    inventario_db: aroma
    pedidos_db: aroma
    resenas_db: aroma
