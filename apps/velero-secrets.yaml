# Aplica los secretos sellados solo despues de que el controlador exista.
# Ola -1: despues de sealed-secrets (-2) y antes de velero (0), para que
# el Secret velero-minio-credentials ya este descifrado cuando arranque
# el pod de Velero que lo monta.
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: velero-secrets
  namespace: argocd
  annotations:
    argocd.argoproj.io/sync-wave: "-1"
  finalizers:
    - resources-finalizer.argocd.argoproj.io
spec:
  project: default
  source:
    repoURL: https://github.com/lurdesss/aroma-gitops.git
    targetRevision: main
    path: secrets
    directory:
      recurse: true
  destination:
    server: https://kubernetes.default.svc
    namespace: velero
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    # Reintento con espera creciente: en una reconstruccion desde cero
    # el primer intento puede fallar si el CRD o el namespace aun no
    # existen; sin "retry" ArgoCD no reintenta el mismo commit.
    retry:
      limit: 10
      backoff:
        duration: 10s
        factor: 2
        maxDuration: 3m
    syncOptions:
      # Esta Application se aplica antes que el chart de Velero, que es
      # quien crea el namespace.
      - CreateNamespace=true
      # Si el CRD SealedSecret aun no esta registrado, no fallar el dry-run.
      - SkipDryRunOnMissingResource=true
