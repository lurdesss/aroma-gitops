# Operador CloudNativePG: administra PostgreSQL con replicacion en
# streaming y failover automatico (Cluster de bd/cluster.yaml).
#
# Por que un operador y no un StatefulSet de PostgreSQL de 1 replica: en
# kind el volumen local-path queda amarrado al nodo donde se creo. Con una
# sola instancia, drenar ese nodo deja la base de datos caida hasta que el
# nodo vuelva. Con 2 instancias (una por worker), al perder un nodo el
# operador promueve la replica del otro nodo y el servicio continua.
#
# Ola 0: debe estar Healthy (CRD Cluster registrado y webhook listo)
# antes de la ola 2, donde se aplica el Cluster.
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: cnpg-operator
  namespace: argocd
  annotations:
    argocd.argoproj.io/sync-wave: "0"
  finalizers:
    - resources-finalizer.argocd.argoproj.io
spec:
  project: default
  source:
    repoURL: https://cloudnative-pg.github.io/charts
    chart: cloudnative-pg
    targetRevision: 0.29.1
    helm:
      values: |
        # Limites explicitos: el operador no corre en aroma-prod, pero se
        # declaran igual para que ninguna carga quede sin limites.
        resources:
          requests: { cpu: 50m, memory: 128Mi }
          limits:   { cpu: 500m, memory: 256Mi }
  destination:
    server: https://kubernetes.default.svc
    namespace: cnpg-system
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    retry:
      limit: 10
      backoff:
        duration: 10s
        factor: 2
        maxDuration: 3m
    syncOptions:
      - CreateNamespace=true
      # Los CRD de CloudNativePG superan el limite de 256 KB de la
      # anotacion last-applied-configuration (mismo caso que Kyverno);
      # la documentacion del operador exige aplicarlos server-side.
      - ServerSideApply=true
