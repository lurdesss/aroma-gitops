# Instala Kyverno. Las 3 politicas obligatorias (sin "latest", limites
# de CPU/memoria, sin root) van en policies/ -- una Application aparte,
# porque necesitan que Kyverno ya este arriba antes de aplicarse.
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: kyverno
  namespace: argocd
  # Recomendacion oficial de Kyverno para instalaciones via ArgoCD
  # (kyverno.io/docs/installation/platform-notes): el ServerSideApply
  # en syncOptions no basta por si solo en todas las versiones de
  # ArgoCD para CRD de este tamaño -- hace falta ademas esta anotacion
  # de comparacion.
  annotations:
    argocd.argoproj.io/compare-options: ServerSideDiff=true,IncludeMutationWebhook=true
  finalizers:
    - resources-finalizer.argocd.argoproj.io
spec:
  project: default
  source:
    repoURL: https://kyverno.github.io/kyverno
    chart: kyverno
    targetRevision: 3.3.6
  destination:
    server: https://kubernetes.default.svc
    namespace: kyverno
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
      # Los CRD de Kyverno son demasiado grandes para el metodo de
      # aplicacion por defecto (la anotacion "last-applied-configuration"
      # supera el limite de 256 KB de etcd -- error real que aparecio al
      # sincronizar). Server-Side Apply no tiene ese limite.
      - ServerSideApply=true
