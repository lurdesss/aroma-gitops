# Base de datos de produccion: recurso "postgresql" del operador de
# Zalando (carpeta bd/). Su PodDisruptionBudget lo crea el operador
# (ver apps/postgres-operator.yaml).
#
# Ola 2: despues del operador (ola 0). El namespace aroma-prod lo crea
# Terraform (con cuota y LimitRange), por eso aqui no se usa
# CreateNamespace.
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: aroma-bd
  namespace: argocd
  annotations:
    argocd.argoproj.io/sync-wave: "2"
  finalizers:
    - resources-finalizer.argocd.argoproj.io
spec:
  project: default
  source:
    repoURL: https://github.com/lurdesss/aroma-gitops.git
    targetRevision: main
    path: bd
    directory:
      recurse: true
  destination:
    server: https://kubernetes.default.svc
    namespace: aroma-prod
  syncPolicy:
    automated:
      # prune desactivado a proposito: borrar el recurso postgresql desde
      # Git borraria tambien el StatefulSet y sus datos. Retirar la base de datos
      # debe ser una decision explicita, no un efecto de un commit.
      prune: false
      selfHeal: true
    retry:
      limit: 10
      backoff:
        duration: 10s
        factor: 2
        maxDuration: 3m
    syncOptions:
      # El CRD postgresql lo registra el operador; en una reconstruccion
      # puede no existir todavia en el primer intento.
      - SkipDryRunOnMissingResource=true
