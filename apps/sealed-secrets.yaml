# Instala el controlador de Sealed Secrets. La llave privada que
# descifra los secretos vive DENTRO de este controlador -- por eso la
# continuidad de esta llave (respaldarla y poder restaurarla) es uno
# de los requisitos centrales de la practica (seccion 3.2: "Continuidad
# de los secretos"). El respaldo lo hace el Schedule "respaldo-llaves"
# de Velero (backups/schedule.yaml), no esta Application.
# Ola -2: debe estar Healthy antes de que se apliquen SealedSecrets.
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: sealed-secrets
  namespace: argocd
  annotations:
    argocd.argoproj.io/sync-wave: "-2"
  finalizers:
    - resources-finalizer.argocd.argoproj.io
spec:
  project: default
  source:
    # Bitnami migro este repositorio de la organizacion "bitnami-labs"
    # a "bitnami" en junio de 2026. Las URLs de GitHub Pages no
    # redirigen solas (a diferencia de "git clone"/"git fetch"), asi
    # que la URL vieja (bitnami-labs.github.io/...) empezo a devolver
    # 404 de un dia para otro.
    repoURL: https://bitnami.github.io/sealed-secrets
    chart: sealed-secrets
    targetRevision: 2.16.2
    helm:
      values: |
        fullnameOverride: sealed-secrets-controller
  destination:
    server: https://kubernetes.default.svc
    namespace: kube-system
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    # Reintento con espera creciente: en una reconstruccion desde cero
    # el primer intento puede fallar si el CRD o el namespace aun no
    # existen; sin "retry" ArgoCD no reintenta el mismo commit.
    retry:
      limit: 10
      backoff:
        duration: 10s
        factor: 2
        maxDuration: 3m
