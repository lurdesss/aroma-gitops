# Instala Velero con almacenamiento compatible con S3 fuera del cluster.
# Ola 0: requiere el Secret velero-minio-credentials (ola -1).
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: velero
  namespace: argocd
  annotations:
    argocd.argoproj.io/sync-wave: "0"
  finalizers:
    - resources-finalizer.argocd.argoproj.io
spec:
  project: default
  source:
    repoURL: https://vmware-tanzu.github.io/helm-charts
    chart: velero
    targetRevision: 8.1.0
    helm:
      values: |
        initContainers:
          - name: velero-plugin-for-aws
            image: velero/velero-plugin-for-aws:v1.11.0
            imagePullPolicy: IfNotPresent
            volumeMounts:
              - mountPath: /target
                name: plugins
        credentials:
          useSecret: true
          existingSecret: velero-minio-credentials
        configuration:
          backupStorageLocation:
            - name: default
              provider: aws
              bucket: velero-backups
              default: true
              credential:
                name: velero-minio-credentials
                key: cloud
              config:
                region: us-east-1
                s3ForcePathStyle: "true"
                s3Url: http://minio:9000
          volumeSnapshotLocation: []
          uploaderType: kopia
          defaultVolumesToFsBackup: true
        snapshotsEnabled: false
        deployNodeAgent: true
        nodeAgent:
          podVolumePath: /var/lib/kubelet/pods
        # El Job "velero-upgrade-crds" solo sirve al subir de version; en
        # una instalacion nueva los CRD llegan por la sincronizacion normal
        # del chart. Al desactivarlo ya no se usa la imagen bitnami/kubectl,
        # por eso se elimino el override que fijaba su tag flotante
        # (prohibido por Kyverno y no versionable).
        upgradeCRDs: false
        # Configuracion del init container "restore-wait" que Velero inyecta
        # en cada pod restaurado con volumenes (restauracion a nivel de
        # archivo). Sin esto, en aroma-prod:
        # - Kyverno rechazaria el pod restaurado (contenedor sin limites).
        # - El kubelet rechazaria runAsNonRoot: la imagen de Velero declara
        #   un usuario por nombre ("cnb"), que no se puede verificar; por eso
        #   se fija un uid numerico. La raiz del volumen local-path tiene
        #   permisos 777, asi que ese uid puede borrar el marcador .velero.
        configMaps:
          fs-restore-action-config:
            labels:
              velero.io/plugin-config: ""
              velero.io/pod-volume-restore: RestoreItemAction
            data:
              # Imagen propia del helper (trae /velero-restore-helper). La
              # imagen del servidor (velero/velero) no lo incluye: con ella el
              # init container fallo con "stat /velero-restore-helper: no such
              # file or directory" en el ensayo de restauracion del Bloque 8b.
              image: velero/velero-restore-helper:v1.15.0
              cpuRequest: 50m
              memRequest: 64Mi
              cpuLimit: 200m
              memLimit: 128Mi
              secCtx: |
                runAsNonRoot: true
                runAsUser: 1000
                runAsGroup: 1000
                allowPrivilegeEscalation: false
                readOnlyRootFilesystem: true
                capabilities:
                  drop: ["ALL"]
  destination:
    server: https://kubernetes.default.svc
    namespace: velero
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    # Reintento con espera creciente: en una reconstruccion desde cero
    # el primer intento puede fallar si el CRD o el namespace aun no
    # existen; sin "retry" ArgoCD no reintenta el mismo commit.
    retry:
      limit: 10
      backoff:
        duration: 10s
        factor: 2
        maxDuration: 3m
    syncOptions:
      - CreateNamespace=true
