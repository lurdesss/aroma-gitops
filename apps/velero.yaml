# Instala Velero con almacenamiento compatible con S3 fuera del cluster.
# Ola 0: requiere el Secret velero-minio-credentials (ola -1).
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: velero
  namespace: argocd
  annotations:
    argocd.argoproj.io/sync-wave: "0"
  finalizers:
    - resources-finalizer.argocd.argoproj.io
spec:
  project: default
  source:
    repoURL: https://vmware-tanzu.github.io/helm-charts
    chart: velero
    targetRevision: 8.1.0
    helm:
      values: |
        initContainers:
          - name: velero-plugin-for-aws
            image: velero/velero-plugin-for-aws:v1.11.0
            imagePullPolicy: IfNotPresent
            volumeMounts:
              - mountPath: /target
                name: plugins
        credentials:
          useSecret: true
          existingSecret: velero-minio-credentials
        configuration:
          backupStorageLocation:
            - name: default
              provider: aws
              bucket: velero-backups
              default: true
              credential:
                name: velero-minio-credentials
                key: cloud
              config:
                region: us-east-1
                s3ForcePathStyle: "true"
                s3Url: http://minio:9000
          volumeSnapshotLocation: []
          uploaderType: kopia
          defaultVolumesToFsBackup: true
        snapshotsEnabled: false
        deployNodeAgent: true
        nodeAgent:
          podVolumePath: /var/lib/kubelet/pods
        # El Job "velero-upgrade-crds" solo sirve al subir de version; en
        # una instalacion nueva los CRD llegan por la sincronizacion normal
        # del chart. Al desactivarlo ya no se usa la imagen bitnami/kubectl,
        # por eso se elimino el override "tag: latest" (prohibido por Kyverno).
        upgradeCRDs: false
  destination:
    server: https://kubernetes.default.svc
    namespace: velero
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    # Reintento con espera creciente: en una reconstruccion desde cero
    # el primer intento puede fallar si el CRD o el namespace aun no
    # existen; sin "retry" ArgoCD no reintenta el mismo commit.
    retry:
      limit: 10
      backoff:
        duration: 10s
        factor: 2
        maxDuration: 3m
    syncOptions:
      - CreateNamespace=true
