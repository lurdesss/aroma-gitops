# Instala Velero. El destino de los respaldos (MinIO local, ver
# P9/backups/) y el schedule programado se configuran en una capa
# posterior, una vez que Velero mismo este arriba y MinIO este
# accesible desde el cluster.
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: velero
  namespace: argocd
  finalizers:
    - resources-finalizer.argocd.argoproj.io
spec:
  project: default
  source:
    repoURL: https://vmware-tanzu.github.io/helm-charts
    chart: velero
    targetRevision: 8.1.0
    helm:
      values: |
        # El chart calcula automaticamente la version de la imagen
        # "bitnami/kubectl" a partir de la version del cluster (por
        # ejemplo ":1.37"), pero esa etiqueta especifica ya no existe
        # en Docker Hub -- mismo problema de deprecacion de imagenes
        # publicas de Bitnami que ya se resolvio en la Practica 6.
        kubectl:
          image:
            tag: latest
        # El Job "velero-upgrade-crds" es un paso pensado para
        # actualizar CRD ya existentes al subir de version de Velero.
        # En una instalacion nueva (como esta) no hace falta: los
        # mismos CRD ya llegan por el flujo normal de sincronizacion
        # del chart (visibles directamente como recursos Sync/0 en el
        # plan de ArgoCD). Se desactiva porque, ademas de ser
        # redundante aqui, el contenedor "velero" del Job fallaba de
        # forma intermitente al ejecutar el pipe interno hacia kubectl.
        upgradeCRDs: false
  destination:
    server: https://kubernetes.default.svc
    namespace: velero
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
